<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algorave Kit</title>
  <style>
    :root {
      --bg: #0d0d12;
      --panel: #16161f;
      --line: #2a2a38;
      --text: #e8e8f0;
      --muted: #8a8aa0;
      --accent: #ff3d9a;
      --accent-2: #3dffd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: 0.08em; }
    h1 span { color: var(--accent); }
    .controls { display: flex; gap: 8px; margin-left: auto; }
    button {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.play { border-color: var(--accent-2); color: var(--accent-2); }
    .hint { color: var(--muted); font-size: 12px; }
    kbd {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 4px;
      font-size: 11px;
    }
    nav {
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: 8px;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      margin-bottom: 6px;
      padding: 8px 10px;
    }
    nav button.active { border-color: var(--accent); background: #22161e; }
    nav small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    main { min-width: 0; padding: 12px 16px; overflow: auto; }
    #about { color: var(--muted); margin: 0 0 10px; }
    #editor-host .cm-editor { min-height: 60vh; font-size: 15px; }
    @media (max-width: 720px) {
      body { height: auto; overflow: visible; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ALGO<span>RAVE</span> KIT</h1>
    <span class="hint">
      <kbd>Ctrl</kbd>+<kbd>Enter</kbd> play / update &nbsp;·&nbsp;
      <kbd>Ctrl</kbd>+<kbd>.</kbd> stop
    </span>
    <div class="controls">
      <button class="play" id="play">▶ Play</button>
      <button id="stop">■ Stop</button>
    </div>
  </header>

  <nav id="list"></nav>

  <main>
    <p id="about"></p>
    <div id="editor-host">
      <strudel-editor id="repl"></strudel-editor>
    </div>
  </main>

  <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
  <script src="patterns.js"></script>
  <script>
    const repl = document.getElementById('repl');
    const list = document.getElementById('list');
    const about = document.getElementById('about');
    let playing = false;

    function select(i) {
      const p = window.PATTERNS[i];
      about.textContent = p.about;
      [...list.children].forEach((b, j) => b.classList.toggle('active', i === j));
      repl.setAttribute('code', p.code);
      if (playing) setTimeout(() => repl.editor?.evaluate(), 50);
    }

    window.PATTERNS.forEach((p, i) => {
      const b = document.createElement('button');
      b.innerHTML = `${p.name}<small></small>`;
      b.querySelector('small').textContent = p.about;
      b.onclick = () => select(i);
      list.append(b);
    });

    document.getElementById('play').onclick = () => { playing = true; repl.editor?.evaluate(); };
    document.getElementById('stop').onclick = () => { playing = false; repl.editor?.stop(); };
    repl.addEventListener('update', (e) => { playing = !!e.detail?.started; });

    select(0);
  </script>
</body>
</html>
